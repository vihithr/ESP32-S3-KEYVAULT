; KeyVault USB —— ESP32-S3 纯 USB 密钥管理设备
; USB 复合设备 (CDC-NCM + RNDIS) + 内置 DHCP Server + HTTP 管理界面
; 固件不启用 Wi-Fi 与蓝牙，详见 sdkconfig.esp32-s3-devkitm-1

; 独立构建目录：配置变更后避免对旧目标文件做批量删除
; build-usb4：分区表调整（vault/vault2 64KB -> 128KB）触发 CMake 重新配置时使用
[platformio]
build_dir = .pio/build-usb4

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
; 实际板载 Flash 为 4MB（开发板默认 8MB 会被覆盖，这里强制指定）
board_build.flash_size = 4MB
; 同时覆盖镜像头/烧录用的 flash size（esptool --flash_size 来源）
board_upload.flash_size = 4MB


monitor_speed = 115200
board_build.partitions = partitions.csv
; ESP32-S3 原生 USB Serial/JTAG（烧录 + 日志），与 USB-OTG(GPIO19/20) 是两个独立接口。
; 端口不写死，交给 PlatformIO 自动探测；换机器/换口后才需要显式指定：
;   upload_port = COMxx
;   monitor_port = COMxx
; 每次构建前由 src/index.html 重新生成 src/web_content.c（单次转义，防手改/过期）
extra_scripts = pre:tools/gen_web_content.py
